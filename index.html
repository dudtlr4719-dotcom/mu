    if(!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
  }

  if (data.lastChecked) {
    lastChecked.textContent = '마지막 확인: ' + fmtDate(data.lastChecked);
  }

  function buildCard(e){
    var card = document.createElement('div');
    card.className = 'card';

    var photo = document.createElement('div');
    photo.className = 'photo';
    if (e.photoDataUri) {
      var img = document.createElement('img');
      img.src = e.photoDataUri;
      img.alt = (e.name || '') + ' wearing MUUT';
      photo.appendChild(img);
    } else {
      var noimg = document.createElement('div');
      noimg.className = 'noimg';
      noimg.textContent = 'NO PHOTO';
      photo.appendChild(noimg);
    }
    card.appendChild(photo);

    var body = document.createElement('div');
    body.className = 'body';

    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = e.name || '이름 미상';
    body.appendChild(name);

    if (e.product) {
      var product = document.createElement('div');
      product.className = 'product';
      product.textContent = e.product;
      body.appendChild(product);
    }

    if (e.note) {
      var note = document.createElement('div');
      note.className = 'note';
      note.textContent = e.note;
      body.appendChild(note);
    }

    var meta = document.createElement('div');
    meta.className = 'meta';
    var dateSpan = document.createElement('span');
    dateSpan.className = 'date';
    dateSpan.textContent = fmtDate(e.date);
    meta.appendChild(dateSpan);

    if (e.url) {
      var a = document.createElement('a');
      a.href = e.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = (e.source || '출처 보기');
      meta.appendChild(a);
    } else if (e.source) {
      var srcSpan = document.createElement('span');
      srcSpan.textContent = e.source;
      meta.appendChild(srcSpan);
    }

    body.appendChild(meta);
    card.appendChild(body);
    return card;
  }

  function renderEmpty(kind){
    var empty = document.createElement('div');
    empty.className = 'empty';
    if (kind === 'no-data') {
      empty.innerHTML =
        '<div class="glyph">◎</div>' +
        '<h2>아직 포착된 사례가 없습니다</h2>' +
        '<p>매일 오전 10:00, MUUT 아이웨어를 착용한 셀럽·인플루언서 소식을 자동으로 확인하고 있어요. 발견되는 즉시 이 자리에 사진과 함께 기록됩니다.</p>';
    } else {
      empty.innerHTML =
        '<div class="glyph">◎</div>' +
        '<h2>검색 결과가 없습니다</h2>' +
        '<p>다른 제품명이나 이름으로 다시 검색해보세요.</p>';
    }
    grid.appendChild(empty);
  }

  function renderList(list){
    grid.innerHTML = '';
    if (list.length === 0) {
      renderEmpty(entries.length === 0 ? 'no-data' : 'search');
      return;
    }
    list.forEach(function(e){ grid.appendChild(buildCard(e)); });
  }

  function updateCounts(filteredLen, query){
    if (query) {
      countLabel.textContent = entries.length + '건 기록됨';
      searchCount.textContent = filteredLen + '건 검색됨';
    } else {
      countLabel.textContent = entries.length + '건 기록됨';
      searchCount.textContent = '';
    }
  }

  function applySearch(){
    var q = (searchInput.value || '').trim().toLowerCase();
    if (!q) {
      updateCounts(entries.length, '');
      renderList(entries);
      return;
    }
    var filtered = entries.filter(function(e){
      var haystack = ((e.product || '') + ' ' + (e.name || '')).toLowerCase();
      return haystack.indexOf(q) !== -1;
    });
    updateCounts(filtered.length, q);
    renderList(filtered);
  }

  searchInput.addEventListener('input', applySearch);
  applySearch();
})();
</script>
